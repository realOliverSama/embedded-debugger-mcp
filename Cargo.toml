[package]
name = "embedded-debugger-mcp"
version = "0.3.0"
edition = "2021"
authors = ["adancurusul <adancurusul@gmail.com>"]
description = "A Model Context Protocol server for embedded debugging via probe-rs or OpenOCD - ARM Cortex-M, RISC-V, and Xtensa (ESP32), with memory/flash/RTT and AI crash diagnosis"
license = "MIT"
readme = "README.md"
repository = "https://github.com/adancurusul/embedded-debugger-mcp"
keywords = ["mcp", "debugging", "embedded", "probe-rs", "openocd"]
categories = ["development-tools", "embedded"]

[dependencies]
# MCP SDK
rmcp = { version = "0.3.2", features = ["server", "macros", "transport-io"] }

# Core debugging library
probe-rs = "=0.30.0"
probe-rs-debug = "=0.30.0"

# Async runtime
tokio = { version = "1.41", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "1.0", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Command line and configuration
clap = { version = "4.5", features = ["derive", "env"] }
toml = "0.8"

# Utilities
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# ELF parsing and hashing for the SRAM loader
object = { version = "0.37", default-features = false, features = ["read", "elf", "std"] }
sha2 = "0.11"
hex = "0.4"
base64 = "0.22"

# ELF parsing for RTT symbol detection
goblin = "0.8"

# Async utilities
futures = "0.3"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3.14"
tokio-test = "0.4"

[features]
default = []
full-integration = []

[[bin]]
name = "embedded-debugger-mcp"
path = "src/main.rs"

[lib]
name = "embedded_debugger_mcp"
path = "src/lib.rs"
